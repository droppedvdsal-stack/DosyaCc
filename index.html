<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Yapımı Masaüstü Dosya Stüdyosu</title>
    <style>
        :root {
            --bg: #121214;
            --panel: #1a1a1e;
            --card: #222228;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text: #f4f4f5;
            --text-muted: #a1a1aa;
            --border: #27272a;
            --success: #10b981;
            --danger: #ef4444;
        }

        /* El Yapımı / Pastel Tema Modu */
        body.theme-retro {
            --bg: #1e1b18;
            --panel: #292522;
            --card: #3f3832;
            --accent: #d97706;
            --accent-hover: #b45309;
            --text: #fef3c7;
            --text-muted: #d6d3d1;
            --border: #57534e;
        }

        /* Aydınlık Defter Modu */
        body.theme-light {
            --bg: #f8fafc;
            --panel: #ffffff;
            --card: #f1f5f9;
            --accent: #0284c7;
            --accent-hover: #0369a1;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: 0.2s;
        }

        header {
            background-color: var(--panel);
            border-bottom: 1px solid var(--border);
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        select, button {
            background-color: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
        }

        button:hover, select:hover {
            border-color: var(--accent);
        }

        .btn-main {
            background-color: var(--accent);
            color: #fff;
            border: none;
        }

        .btn-main:hover {
            background-color: var(--accent-hover);
        }

        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sol Menü */
        aside {
            width: 250px;
            background-color: var(--panel);
            border-right: 1px solid var(--border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .menu-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .tab-btn {
            text-align: left;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text);
            font-size: 0.95rem;
            cursor: pointer;
        }

        .tab-btn.active {
            background-color: var(--card);
            border-color: var(--accent);
            font-weight: 600;
        }

        .info-card {
            margin-top: auto;
            background-color: var(--card);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        /* Ana İçerik */
        main {
            flex: 1;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
        }

        .drop-box {
            border: 2px dashed var(--border);
            background-color: var(--panel);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .drop-box:hover {
            border-color: var(--accent);
            background-color: var(--card);
        }

        .workspace-panel {
            flex: 1;
            background-color: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            min-height: 250px;
        }

        .workspace-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
            font-weight: 600;
        }

        .preview-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
            border-radius: 8px;
            background: var(--bg);
            padding: 10px;
        }

        textarea {
            width: 100%;
            height: 100%;
            min-height: 220px;
            background: transparent;
            color: var(--text);
            border: none;
            outline: none;
            font-family: monospace;
            font-size: 0.95rem;
            resize: none;
        }

        img, video {
            max-width: 100%;
            max-height: 300px;
            border-radius: 6px;
        }

        audio {
            width: 100%;
        }

        /* Alt Kaydetme Çubuğu */
        footer {
            background-color: var(--panel);
            border-top: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            gap: 14px;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .name-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 300px;
        }

        .name-group input {
            flex: 1;
            background-color: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        .name-group input:focus {
            border-color: var(--accent);
        }

        #toast {
            position: fixed;
            bottom: 80px;
            right: 24px;
            background-color: var(--accent);
            color: #fff;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            opacity: 0;
            transition: 0.3s;
            pointer-events: none;
        }

        #toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <span>🛠️</span>
            <span>Özel Masaüstü Stüdyo</span>
        </div>
        <div class="controls">
            <select onchange="changeTheme(this.value)">
                <option value="dark">🌙 Koyu Mod</option>
                <option value="retro">☕ El Yapımı / Kahve</option>
                <option value="light">☀️ Kağıt / Aydınlık</option>
            </select>
        </div>
    </header>

    <div class="container">
        <aside>
            <div class="menu-title">İşlem Modları</div>
            <button class="tab-btn active" onclick="setMode('all', this)">📂 Tüm Dosyalar</button>
            <button class="tab-btn" onclick="setMode('code', this)">💻 Kod / Metin Yaz</button>
            <button class="tab-btn" onclick="setMode('media', this)">🎵 Müzik / Video / Resim</button>

            <div class="info-card">
                <div>Seçilen Boyut: <span id="fileSize">0 KB</span></div>
                <div>Durum: <span id="fileStatus">Hazır</span></div>
            </div>
        </aside>

        <main>
            <div class="drop-box" onclick="document.getElementById('fileInput').click()">
                <h3 id="dropTitle">Bilgisayarından veya Galerinden Dosya Seç</h3>
                <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 4px;">Tıkla veya sürükle bırak</p>
                <input type="file" id="fileInput" hidden onchange="fileLoaded(event)">
            </div>

            <div class="workspace-panel">
                <div class="workspace-header">
                    <span id="panelTitle">Çalışma & Önizleme Alanı</span>
                    <button onclick="newBlankCode()" style="padding: 4px 10px; font-size: 0.8rem;">+ Boş Kod Sayfası</button>
                </div>
                <div class="preview-area" id="previewArea">
                    <span style="color: var(--text-muted);">Henüz bir dosya seçilmedi veya içerik oluşturulmadı.</span>
                </div>
            </div>
        </main>
    </div>

    <footer>
        <div class="name-group">
            <label style="font-weight: 600; font-size: 0.9rem;">Dosya Adı:</label>
            <input type="text" id="fileNameInput" placeholder="dosya_adi.html veya resim.png">
        </div>
        <div style="display: flex; gap: 10px;">
            <button onclick="downloadFile()" class="btn-main" style="padding: 10px 20px;">💾 Masaüstüne / Bilgisayara Kaydet</button>
        </div>
    </footer>

    <div id="toast">İşlem başarılı!</div>

    <script>
        let activeFile = null;
        let fileDataURL = null;

        function changeTheme(theme) {
            document.body.className = '';
            if (theme !== 'dark') document.body.classList.add('theme-' + theme);
            showToast("Tema değiştirildi");
        }

        function setMode(mode, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const input = document.getElementById('fileInput');
            if (mode === 'code') {
                input.setAttribute('accept', '.html,.js,.css,.txt,.json,.md');
                newBlankCode();
            } else if (mode === 'media') {
                input.setAttribute('accept', 'image/*,audio/*,video/*');
            } else {
                input.removeAttribute('accept');
            }
        }

        function fileLoaded(e) {
            if (!e.target.files.length) return;
            const file = e.target.files[0];
            activeFile = file;
            document.getElementById('fileNameInput').value = file.name;
            document.getElementById('fileSize').innerText = (file.size / 1024).toFixed(1) + " KB";
            document.getElementById('fileStatus').innerText = "Yüklendi";

            const area = document.getElementById('previewArea');
            area.innerHTML = '';

            const reader = new FileReader();

            if (file.type.startsWith('text/') || /\.(html|js|css|txt|json|md|py)$/i.test(file.name)) {
                reader.onload = (evt) => {
                    area.innerHTML = `<textarea id="codeText">${evt.target.result}</textarea>`;
                };
                reader.readAsText(file);
            } else if (file.type.startsWith('image/')) {
                reader.onload = (evt) => {
                    fileDataURL = evt.target.result;
                    area.innerHTML = `<img src="${fileDataURL}">`;
                };
                reader.readAsDataURL(file);
            } else if (file.type.startsWith('audio/')) {
                reader.onload = (evt) => {
                    fileDataURL = evt.target.result;
                    area.innerHTML = `<audio controls src="${fileDataURL}"></audio>`;
                };
                reader.readAsDataURL(file);
            } else if (file.type.startsWith('video/')) {
                reader.onload = (evt) => {
                    fileDataURL = evt.target.result;
                    area.innerHTML = `<video controls src="${fileDataURL}"></video>`;
                };
                reader.readAsDataURL(file);
            } else {
                reader.onload = (evt) => {
                    fileDataURL = evt.target.result;
                    area.innerHTML = `<div style="text-align:center;"><h3>📦 ${file.name}</h3><p style="color:var(--text-muted); margin-top:6px;">Dosya paketlenmeye hazır!</p></div>`;
                };
                reader.readAsDataURL(file);
            }
        }

        function newBlankCode() {
            activeFile = null;
            document.getElementById('fileNameInput').value = "proje.html";
            document.getElementById('fileStatus').innerText = "Kod Yazılıyor";
            document.getElementById('previewArea').innerHTML = `<textarea id="codeText"><!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Sayfam</title></head>
<body>
    <h1>Merhaba Dünya!</h1>
</body>
</html></textarea>`;
        }

        async function downloadFile() {
            const name = document.getElementById('fileNameInput').value.trim() || "dosya.bin";
            const textarea = document.getElementById('codeText');
            let blob = null;

            if (textarea) {
                blob = new Blob([textarea.value], { type: 'text/plain;charset=utf-8' });
            } else if (activeFile) {
                blob = activeFile;
            } else {
                showToast("Önce bir dosya seçmelisin!");
                return;
            }

            // Doğrudan Masaüstüne / Klasöre Kaydetme Penceresi
            if (window.showSaveFilePicker) {
                try {
                    const handle = await window.showSaveFilePicker({ suggestedName: name });
                    const writable = await handle.createWritable();
                    await writable.write(blob);
                    await writable.close();
                    showToast("✅ Dosya başarıyla kaydedildi!");
                    return;
                } catch (err) {
                    if (err.name === 'AbortError') return;
                }
            }

            // Klasik İndirme Yöntemi (Garanti Çalışır)
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            showToast("✅ Dosya bilgisayara indirildi!");
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
